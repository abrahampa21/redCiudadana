<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/panelCiudadano.css" />
    <link rel="icon" href="../src/img/icon-pages.jfif" />
    <link href="../src/output.css" rel="stylesheet" />
    <title>Panel del ciudadano</title>
  </head>
  <body>
    <div id="sidebar-container"></div>

    <!-- Reportes-->
    <main class="main-container reportes-container">
      <div class="topbar">
        <h1>Reportes</h1>
        <button id="btn-new" class="btn-new" title="btn-new">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path>
          </svg>
          Nuevo
        </button>
      </div>
      <div class="search-container">
        <div class="filters">
          <input type="text" placeholder="Buscar..." />
          <select name="" id="estado">
            <option value="">Estado: Todos</option>
            <option>Pendiente</option>
            <option>En proceso</option>
            <option>Resuelto</option>
          </select>
          <select name="" id="categoria"></select>
          <select name="" id="prioridad">
            <option value="">Prioridad: Todas</option>
            <option>Baja</option>
            <option>Media</option>
            <option>Alta</option>
          </select>
        </div>
        <button>Limpiar</button>
      </div>

      <div class="reportes-list">
        <div class=""><p>No se encontraron reportes.</p></div>
      </div>
    </main>

    <script>
      fetch("../includes/sidebarCiudadano.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebar-container").innerHTML = data;
        });
    </script>
    <script src="../assets/js/panelCiudadano.js"></script>
  </body>
</html>
