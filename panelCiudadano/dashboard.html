<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/panelCiudadano.css" />
    <link rel="icon" href="../src/img/icon-pages.jfif" />
    <link href="../src/output.css" rel="stylesheet" />
    <title>Panel del ciudadano</title>
  </head>
  <body>
    <div id="sidebar-container"></div>

    <!-- DASHBOARD -->
    <main class="dashboard flex flex-1 flex-column overflow-auto">
      <div class="page hidden p-8" id="page-dashboard">
        <div>
          <h1 class="page-title text-[1.6rem] font-bold">Bienvenido al sistema de reportes</h1>
          <div class="page-sub" id="dash-sub"></div>
        </div>
        <div>
          <div class="stat-grid grid grid-cols-4 gap-4 mb-6">
            <div class="stat-card bg-white rounded-xl p-5 border border-slate-200">
              <div class="stat-label flex items-center gap-2 text-xs font-semibold mb-2.5">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="#f59e0b">
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
                  />
                </svg>
                <span >Pendientes</span>
              </div>
              <div class="stat-num" id="d-pend">0</div>
            </div>
            <div class="stat-card bg-white rounded-xl p-5 border border-slate-200">
              <div class="stat-label">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="#3b82f6">
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"
                  />
                </svg>
                <span >En Proceso</span>
              </div>
              <div class="stat-num" id="d-proc">0</div>
            </div>
            <div class="stat-card bg-white rounded-xl p-5 border border-slate-200">
              <div class="stat-label">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="#22c55e">
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"
                  />
                </svg>
                <span >Resueltos</span>
              </div>
              <div class="stat-num" id="d-res">0</div>
            </div>
            <div class="stat-card bg-white rounded-xl p-5 border border-slate-200">
              <div class="stat-label">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="#ef4444">
                  <path
                    d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"
                  />
                </svg>
                <span >Alta Prioridad</span>
              </div>
              <div class="stat-num" id="d-alta">0</div>
            </div>
          </div>
          <div class="card">
            <h3>Reportes Recientes</h3>
            <div id="recent-list">
              <p class="empty-msg">No hay reportes aún.</p>
            </div>
          </div>
        </div>
      </div>
    </main>


    <script>
      fetch("../includes/sidebarCiudadano.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebar-container").innerHTML = data;
        });
    </script>
  </body>
</html>
