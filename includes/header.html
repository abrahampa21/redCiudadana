<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/panelCiudadano.css" />
    <title>Red Ciudadana</title>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-content">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"
            />
          </svg>
        </div>
      </div>
      <span class="project-name">Reportes Ciudadanos</span>
      <nav>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
            />
          </svg>
          <a href="#">Dashboard</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"
            />
          </svg>
          <a href="#">Reportes</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <a href="#">Nuevo Reporte</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"
            />
          </svg>
          <a href="#">Estadísticas</a>
        </div>
      </nav>
      <div class="sidebar-user">
        <div class="user-info">
          <div class="avatar" id="sb-avatar"></div>
          <div>
            <div class="user-name" id="sb-name"></div>
            <div class="user-role" id="sb-role"></div>
          </div>
        </div>
        <button class="logout-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path
              d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
            />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>
  </body>
</html>
