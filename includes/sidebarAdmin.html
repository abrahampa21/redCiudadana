<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Administrador</title>
    <link rel="stylesheet" href="../assets/css/panelAdmin.css">
</head>
<body>
    <aside class="sidebar fixed">
      <div class="logo-content">
        <div class="brand-icon">
          <img src="../src/img/logo.jpeg" alt="Red ciudadana, logo del proyecto">
        </div>
        <span class="project-name">Reportes </span>
      </div>
      <nav>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
            />
          </svg>
          <a href="../panelAdmin/dashboard.html">Dashboard</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"
            />
          </svg>
          <a href="#">Reportes</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <a href="#">Nuevo Reporte</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"
            />
          </svg>
          <a href="#">Estadísticas</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.89 1.97 1.74 1.97 2.95V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
            />
          </svg>
          <a href="#">Usuarios</a>
        </div>
        <div class="link-element">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
            />
          </svg>
          <a href="#">Categorías</a>
        </div>
      </nav>
      <div class="sidebar-user">
        <div class="user-info">
          <div class="avatar" id="sb-avatar">A</div>
          <div>
            <div class="user-name" id="sb-name"></div>
            <div class="user-role" id="sb-role">Admin</div>
          </div>
        </div>
        <button class="logout-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path
              d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
            />
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </aside>
</body>
</html>
