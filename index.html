<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <script
      src="https://kit.fontawesome.com/e522357059.js"
      crossorigin="anonymous"
    ></script>
    <title>Inicio de Sesión</title>
  </head>
  <body>
    <!--Login-->
    <main id="login" class="login">
      <h1>Reportes ciudadanos</h1>
      <p>Inicia sesión para continuar</p>
      <form action="" method="post">
        <label for="user">Usuario</label>
        <input
          type="text"
          name="user"
          id="user"
          placeholder="Tu nombre de usuario"
          required
        />

        <label for="password">Contraseña</label>
        <input
          type="text"
          name="password"
          id="password"
          placeholder="Tu contraseña"
          required
        />

        <button type="submit" id="login-button">Iniciar Sesión</button>
      </form>
      <p>¿No tienes cuenta? <strong>Regístrate</strong></p>
    </main>

    <!--Registro de ciudadanos-->
    <main id="register" class="register">
      <div class="container">
        <i
          id="back-icon"
          class="arrow fa-solid fa-arrow-left"
          title="Regresar"
        ></i>
        <div class="icon-register">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"
            />
          </svg>
        </div>
        <h1>Registro para ciudadanos</h1>
        <h2>Crea tu cuenta</h2>
        <form action="">
          <div class="nombre-div register-div">
            <p>Nombre completo</p>
            <input
              type="text"
              placeholder="Ej. Juán Pérez"
              required
              name="nombre"
            />
          </div>
          <div class="email-div register-div">
            <p>Correo electrónico</p>
            <input
              type="email"
              placeholder="Ej. alejandro@gmail.com"
              required
              name="email"
            />
          </div>
          <div class="usuario-div register-div">
            <p>Usuario</p>
            <input
              type="text"
              placeholder="Ej. Alejandro85"
              required
              name="user"
            />
          </div>
          <div class="password-div register-div">
            <p>Contraseña</p>
            <input type="password" title="password" required name="password" />
          </div>
          <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <span>Inicia sesión</span></p>
      </div>
    </main>
  </body>
</html>
