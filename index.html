<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <script
      src="https://kit.fontawesome.com/e522357059.js"
      crossorigin="anonymous"
    ></script>
    <title>Inicio de Sesión</title>
  </head>
  <body>
    <!--Login-->
    <main id="login" class="login">
      <div class="container">
        <div class="icon-login">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"
            />
          </svg>
        </div>
      <h1>Reportes ciudadanos</h1>
      <p class="login-message">Inicia sesión para continuar</p>
      <form action="" method="post">
        <div class="usuario-div login-div">
        <label for="user">Usuario</label>
        <input
          type="text"
          name="user"
          id="user"
          placeholder="Tu nombre de usuario"
          required
        />
      </div>
      <div class="password-div login-div">
        <label for="password">Contraseña</label>
        <input
          type="password"
          name="password"
          id="password-login"
          placeholder="Tu contraseña"
          required
        />
        <i class="fa-solid fa-eye" id="password-eye" onclick="revealPassword(this)"></i>
        </div>
        <button type="submit" id="login-button">Iniciar Sesión</button>
      </form>
      <p class="go-register">¿No tienes cuenta? <strong onclick="showRegister()">Regístrate</strong></p>
      </div>
    </main>

    <!--Registro de ciudadanos-->
    <main id="register" class="register">
      <div class="container">
        <i
          id="back-icon"
          class="arrow fa-solid fa-arrow-left"
          title="Regresar"
          onclick="showLogin()";
        ></i>
        <div class="icon-register">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"
            />
          </svg>
        </div>
        <h1>Registro para ciudadanos</h1>
        <p class="create-account">Crea tu cuenta</p>
        <form action="">
          <div class="nombre-div register-div">
            <label>Nombre completo</label>
            <input
              type="text"
              placeholder="Ej. Juán Pérez"
              required
              name="nombre"
            />
          </div>
          <div class="email-div register-div">
            <label>Correo electrónico</label>
            <input
              type="email"
              placeholder="Ej. alejandro@gmail.com"
              required
              name="email"
            />
          </div>
          <div class="usuario-div register-div">
            <label>Usuario</label>
            <input
              type="text"
              placeholder="Ej. Alejandro85"
              required
              name="user"
            />
          </div>
          <div class="password-div register-div">
            <label>Contraseña</label>
            <input type="password" title="password" required name="password" />
          </div>
          <button type="submit">Registrarse</button>
        </form>
        <p class="go-login">¿Ya tienes cuenta? <span onclick="showLogin()">Inicia sesión</span></p>
      </div>
    </main>


    <script src="assets/js/index.js"></script>
  </body>
</html>
